onboarding = false

[ui.sound]
enabled = false

[keys]
prefix = "alt+s"

# Workspaces
switch_workspace = "prefix+1..9"

#Navigate panes
focus_pane_left = "prefix+h"
focus_pane_right = "prefix+l"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"

# Navigate tabs
next_tab = "prefix+right"
previous_tab = "prefix+left"
